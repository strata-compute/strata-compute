<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!-- The strata mark: three sedimentary layers, the active one in the brand
       lime. Colours are literal rather than tokenised — a favicon renders
       outside the document and has no access to the theme's custom properties. -->
  <rect width="24" height="24" rx="5" fill="#080A09"/>
  <path d="M12 3.6 20.4 7.5 12 11.4 3.6 7.5 12 3.6Z" fill="#CCFF00"/>
  <path d="M4 11.9 12 15.6 20 11.9" stroke="#F2F5F3" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55" fill="none"/>
  <path d="M4 16.2 12 19.9 20 16.2" stroke="#F2F5F3" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.28" fill="none"/>
</svg>
