  <g transform="translate(12 12) scale(0.82) translate(-12 -12)">
    <rect x="5" y="4.6" width="14" height="3.1" rx="1.2" fill="#F2F5F3"/>
    <rect x="5" y="10.4" width="14" height="3.1" rx="1.2" fill="#CCFF00"/>
    <rect x="5" y="16.2" width="14" height="3.1" rx="1.2" fill="#F2F5F3"/>
    <rect x="5" y="4.6" width="3.1" height="8.9" rx="1.2" fill="#F2F5F3"/>
    <rect x="15.9" y="10.4" width="3.1" height="8.9" rx="1.2" fill="#F2F5F3"/>
  </g>
</svg>
