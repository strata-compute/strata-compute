<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!-- The strata mark: an S built only from beds. Colours are literal rather
       than tokenised — a favicon renders outside the document and has no
       access to the theme custom properties. -->
